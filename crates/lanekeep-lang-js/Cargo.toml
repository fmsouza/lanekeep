[package]
name = "lanekeep-lang-js"
description = "TypeScript and JavaScript language support for lanekeep."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3 = { workspace = true }
lanekeep-lang = { workspace = true }
lanekeep-tree-sitter-typescript = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-javascript = { workspace = true }

[[bench]]
name = "cfg"
# No harness, matching `crates/lanekeep-types/benches/construction.rs`: this reports an
# absolute figure a human reads once, not a statistical comparison against a baseline.
harness = false

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

# `blake3` is used both in `src/`, which folds the vendored grammar's digest into
# `analysis_identity`, and by `build.rs`, which hashes this crate's own `src/` into
# `analysis_identity`. cargo-machete does not scan build scripts, so it sees the
# `[build-dependencies]` entry as unused regardless of the `[dependencies]` one satisfying it in
# `src/`. `crates/lanekeep-lang/Cargo.toml` carries the same stanza for the same reason.
[package.metadata.cargo-machete]
ignored = ["blake3"]
