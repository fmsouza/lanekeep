[package]
name = "lanekeep-types"
description = "The type oracle: what a node's type is, answered from one parsed file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lanekeep-lang = { workspace = true }
tree-sitter = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
lanekeep-lang-js = { workspace = true }
lanekeep-lang-python = { workspace = true }

[lints]
workspace = true

# `blake3` is used only by `build.rs`, which hashes this crate's own `src/` into
# `oracle_identity`. cargo-machete does not scan build scripts, so it sees a
# `[build-dependencies]` entry nothing in `src/` or `tests/` references and calls it unused
# — the same class of blind spot as `tests/fixtures/metadata/Cargo.toml`'s `wit-bindgen-rt`,
# one layer earlier: there it is generated source the tool cannot see, here it is a source
# file the tool does not look at.
[package.metadata.cargo-machete]
ignored = ["blake3"]
