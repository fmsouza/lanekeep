[package]
name = "lanekeep-types"
description = "The type oracle: what a node's type is, answered from one parsed file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# For `FilePath` and `FileAccess`: a cross-file answer is a *tracked read*, and the type
# that records one lives below every engine on purpose. Reaching the filesystem any other
# way would put a dependency outside the cache key.
lanekeep-core = { workspace = true }
lanekeep-lang = { workspace = true }
# The JS family's binding resolver: the kinds a top-level statement can declare with are
# read through `JsBindingResolver::declares` rather than a second table here, which drifted
# from the resolver once already (#229). Acyclic — that crate depends only on
# `lanekeep-lang` and the grammars.
lanekeep-lang-js = { workspace = true }
# Two readers, both of shapes hand-parsing would get subtly wrong. `package.json`'s `exports`
# is a recursive tree of strings, objects and condition names; and the `tsc` sidecar's protocol
# is newline-delimited JSON in both directions, where this crate is the one writing the
# requests as well as reading the answers.
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
# Now a real dependency as well as a build one: a cached `Declaration` carries the content
# hash its file was parsed at, which is what lets a server-resident provider (#191) drop a
# stale entry without re-parsing.
blake3 = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
lanekeep-lang-js = { workspace = true }
lanekeep-lang-python = { workspace = true }

[[bench]]
name = "construction"
# No harness, matching `crates/lanekeep-engine/benches/`: this reports absolute nanosecond
# figures a human reads once, not a statistical comparison against a stored baseline.
harness = false

[lints]
workspace = true
