[package]
name = "lanekeep-wasm"
description = "WebAssembly component runtime for lanekeep rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# The spike guest is a crate of its own, built for wasm32-unknown-unknown by
# `cargo component`. Its nested manifest has no business in the published .crate, where it
# would only give `cargo package` a second package to resolve and fail to build. The built
# artifact beside it — tests/fixtures/spike.wasm — is deliberately not excluded: it is what
# tests/spike.rs embeds.
exclude = ["tests/fixtures/spike/**"]

[dependencies]
wasmtime = { workspace = true }

[lints]
workspace = true
