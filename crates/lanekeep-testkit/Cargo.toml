[package]
name = "lanekeep-testkit"
description = "Fixture-based rule testing harness for lanekeep."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lanekeep-config = { workspace = true }
lanekeep-core = { workspace = true }
lanekeep-engine = { workspace = true }
lanekeep-js = { workspace = true }
lanekeep-lang-js = { workspace = true }
lanekeep-languages = { workspace = true }
# For the component testers, which generate a `lanekeep.json`. Building it with `format!` would
# work and would turn a caller's malformed `options` into a config parse error somewhere
# downstream, which is exactly the confusion `TestError`'s variants exist to prevent.
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
