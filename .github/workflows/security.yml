name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily. A dependency does not become vulnerable when you happen to push —
    # advisories are published on their own schedule, and a project that only
    # checks on commit stays quietly vulnerable through every quiet week.
    - cron: "17 6 * * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # RustSec advisories against the resolved dependency graph.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - run: cargo audit --deny warnings

  # Licenses, banned crates, source provenance. Overlaps `just check` on pull
  # requests and is the point on the daily schedule, where nothing else runs it.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}

  # Flags a pull request that introduces a vulnerable or badly-licensed dependency
  # while it is still a proposal, rather than after it is on main.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          # Mirrors deny.toml. Two lists that must agree is a maintenance cost, but
          # this one runs on the proposed change and cargo-deny runs on the resolved
          # graph, so they catch different things at different moments.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, ISC, Unicode-3.0, Zlib, CC0-1.0
          # rustc-demangle declares `license = "MIT/Apache-2.0"`, cargo's deprecated
          # slash syntax rather than SPDX's `OR`. This action cannot parse it and
          # reports `LicenseRef-bad-mitapache-2.0`, which is a parser artifact and not
          # a license. cargo-deny reads the legacy form correctly and passes it, so the
          # crate is checked — just not by this job. Exempting the one package is
          # narrower than adding that pseudo-license to the list above, which would let
          # any unparseable declaration through.
          #
          # componentize-py is the same shape on the Python side: its metadata carries
          # no parseable `License`/`License-Expression`, and this action reports
          # `LicenseRef-bad-apache-2.0-and-llvm-exception` — a parser artifact for the
          # Bytecode Alliance's Apache-2.0 WITH LLVM-exception, which is already on the
          # allow list above. The recipe pins it to 0.25.0 and `just py-rules` is the
          # only path that installs it.
          #
          # core_detect is rustc-demangle's shape again: `license = "MIT/Apache-2.0"`,
          # reached through encoding_rs 0.8.41 under wasmtime, on x86 targets only —
          # which is what this job runs on.
          allow-dependencies-licenses: >-
            pkg:cargo/rustc-demangle,
            pkg:cargo/core_detect,
            pkg:pypi/componentize-py

  # OpenSSF Scorecard: branch protection, pinned actions, signed releases, and the
  # rest of the supply-chain posture, scored by someone other than us.
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # sign the result via Sigstore
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing makes the score public and, more usefully, makes a
          # regression in it visible to anyone deciding whether to trust this tool.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          sarif_file: results.sarif
