# The nightly build.
#
# CI on a pull request tells you the change is fine. This tells you the *world* is still
# fine: a dependency that yanked a version, a new clippy lint on the stable channel, a
# transitive advisory published since the last merge. None of those arrive with a commit, so
# nothing else would ever catch them.
#
# It builds the release binaries too, which is the other thing a pull request never does —
# a cross-platform build that only runs on tags breaks on a tag, which is the worst moment.
name: Nightly

on:
  schedule:
    # 04:00 UTC. Late enough that a day's merges have landed, early enough that a European
    # morning starts with the answer.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The same gate a pull request runs, against today's toolchain and today's crates.io.
  gate:
    name: gate (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete,typos

      # Deliberately uncached. A nightly run exists to find what changed underneath the
      # project, and a cache is precisely what would hide it.
      - run: just check

  # Against the newest dependencies the manifests permit, not the ones in the lockfile. This
  # is what finds a semver-compatible release that broke something — the failure mode a
  # committed lockfile is designed to hide from pull requests, and should not hide forever.
  latest-dependencies:
    name: latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest

      - run: cargo update
      - run: just test

  # An advisory published overnight affects a project that has not changed. Nothing else
  # would report it until the next pull request, which might be weeks away.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny

      - run: cargo deny check advisories

  # The release build, nightly, so a cross-platform break is found on an ordinary morning
  # rather than while cutting a release.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Pinned to the same floor the release pins, so this rehearses the build that
          # actually ships rather than a different one. It matters most here: a runner image
          # rolling underneath the project is precisely the kind of change nightly exists to
          # catch, and it is how the floor moved to 2.39 unnoticed in the first place.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.17"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      # Into a virtualenv, because Ubuntu 24.04's system Python is externally managed (PEP 668)
      # and a bare `pip install` there fails outright.
      - name: Install cargo-zigbuild
        if: matrix.glibc != ''
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/zig"
          "${RUNNER_TEMP}/zig/bin/pip" install --quiet cargo-zigbuild==0.23.0 ziglang==0.16.0
          echo "${RUNNER_TEMP}/zig/bin" >> "${GITHUB_PATH}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          if [ -n "${GLIBC}" ]; then
            cargo zigbuild --profile dist --target "${TARGET}.${GLIBC}" -p lanekeep-cli
          else
            cargo build --profile dist --target "${TARGET}" -p lanekeep-cli
          fi

      # The floor the binary actually came out with, asserted rather than assumed. The
      # release checks this too, when it tags a wheel `manylinux_2_17`; doing it nightly is
      # what makes a zigbuild or toolchain regression show up on an ordinary morning.
      - name: Check the glibc floor
        if: matrix.glibc != ''
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: python3 scripts/check_glibc_floor.py "target/${TARGET}/dist/lanekeep" "${GLIBC}"

      - name: Smoke test
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/dist/lanekeep"
          [ -f "${binary}.exe" ] && binary="${binary}.exe"
          "${binary}" --version
