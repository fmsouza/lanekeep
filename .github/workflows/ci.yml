name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs are cancelled: a force-push should not leave the previous run
# burning minutes on a diff nobody will look at again. `main` is excluded, because
# every commit there is a merge someone may need the result of later.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. A job needing more asks for it explicitly, so widening the
# blast radius is a visible diff rather than an inherited default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The whole gate, in one job, by invoking the same recipe a developer runs.
  # There is deliberately no list of steps mirroring the justfile here — a mirror
  # drifts, and the moment it drifts "passes locally" stops meaning anything.
  gate:
    name: gate (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete,typos

      - run: just check

  # Other platforms run the tests only. Formatting, clippy, licensing and spelling
  # are platform-independent, so running them three times buys nothing but minutes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest

      - run: just test

      # The justfile forces bash, which exists on the Windows runner via Git Bash,
      # so the shell tooling is exercised on every platform rather than assumed
      # portable.
      - run: just test-scripts

  # The MSRV in Cargo.toml is a promise to users. Untested, it is a comment that
  # silently becomes false the first time someone uses a newer language feature.
  #
  # This delegates to `just msrv` rather than installing 1.85 and running `cargo
  # check`, because that obvious version does not work: rust-toolchain.toml takes
  # precedence over the installed default, so plain `cargo check` here would test
  # 1.95.0 and pass regardless of what the MSRV actually is. The recipe reads the
  # version out of Cargo.toml and invokes `cargo +<version>`, which is the only
  # form that overrides the pin.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: msrv

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just

      - run: just msrv

  # A single required check to point branch protection at. Adding a job above does
  # not then require also remembering to update the ruleset, and — importantly — a
  # skipped or cancelled dependency fails this rather than silently satisfying it.
  # The performance gate. Separate from `gate` because it needs a release build, which
  # takes long enough that pinning it to the debug-build job would slow every other check
  # down for no reason.
  #
  # The numbers print whether or not the gate fires — a regression that stays under the
  # threshold is still visible to anyone reading the log, which is the point.
  bench:
    name: bench (budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just

      - run: just bench

  # The Go component, rebuilt from source and compared byte for byte against what is committed.
  #
  # This check is possible here and impossible for the TypeScript component beside it.
  # `componentize-js` output is a SpiderMonkey heap image and is not reproducible between two
  # builds of one unchanged tree, so for that artifact a digest manifest is the whole staleness
  # check; it catches a source edited without a rebuild and cannot catch an artifact that no
  # source in the tree produces. A TinyGo build *is* reproducible, so this job closes the second
  # half — and it is the only thing that can, since `LANEKEEP_BLESS_GO_RULES=1` will happily
  # re-record whatever bytes are already in the tree.
  #
  # **Four versions are pinned because all four are inputs to the artifact's bytes.** `tinygo
  # build` shells out to `wasm-opt` and to `wasm-tools`, and compiles the standard library out of
  # the Go toolchain's `GOROOT`; `just go-rules` documents the measurement. Installed by hand
  # rather than through actions, so that the four sit in one table a reader can compare against
  # the machine that produced the committed bytes. A floating version anywhere here is a red diff
  # nobody introduced.
  go-rules:
    name: go-rules (rebuild and diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # The root module has no `go.sum`, and the cache step errors rather than shrugging
          # when it cannot find the file it keys on.
          cache: false

      - name: Install TinyGo
        env:
          TINYGO_VERSION: "0.41.1"
          TINYGO_SHA256: "e156d1d93a376eef639a4143d13be07e8c463fb6cf2d7d447698ed4474d23e91"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/tinygo.tar.gz" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          echo "${TINYGO_SHA256}  ${RUNNER_TEMP}/tinygo.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/tinygo.tar.gz"
          echo "${RUNNER_TEMP}/tinygo/bin" >> "${GITHUB_PATH}"

      # Not the one TinyGo brings. Its Linux tarball bundles binaryen 116 at
      # `$TINYGOROOT/bin/wasm-opt`, and the committed artifacts were built through 131 — 87 bytes
      # apart on `go-builtins.wasm`, with `go-maporder.wasm` identical through both, so nothing
      # smaller than the real artifact would notice. `WASMOPT` is the one override TinyGo honors
      # ahead of the copy in its own root.
      - name: Install binaryen (wasm-opt)
        env:
          BINARYEN_VERSION: "131"
          BINARYEN_SHA256: "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/binaryen.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${RUNNER_TEMP}/binaryen.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/binaryen.tar.gz"
          echo "WASMOPT=${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" >> "${GITHUB_ENV}"

      # TinyGo shells out to this for `component embed` and `component new`. It ships with
      # neither TinyGo nor the runner image, so without it the build dies at the encoding step
      # after a minute in LLVM.
      - name: Install wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.255.0"
          WASM_TOOLS_SHA256: "a62237f4731c45f665f1115cad39acaeec02963cbc848c9473ab033eed837072"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wasm-tools.tar.gz" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          echo "${WASM_TOOLS_SHA256}  ${RUNNER_TEMP}/wasm-tools.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/wasm-tools.tar.gz"
          echo "${RUNNER_TEMP}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux" >> "${GITHUB_PATH}"

      # `just go-rules` records the digest manifest through `cargo test`, so this job needs the
      # Rust toolchain as well as the Go one.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: go-rules

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just

      # Which also runs `gofmt -l`, `go vet` and `go test` over `go-rules/`, and re-records the
      # digest manifest — so a stale manifest lands in the diff below exactly as a stale artifact
      # does. That is the intent and not a side effect.
      - run: just go-rules

      - name: The committed artifacts must be the ones these sources build
        # **The assignment is a statement of its own, and that is the whole point.** `bash -e`
        # does not abort on a command substitution that fails inside `[ ... ]` — the exit
        # status the shell sees is the test's, not git's. Written as
        # `if [ -z "$(git status --porcelain)" ]`, a git that dies for any reason at all
        # substitutes the empty string, the branch is taken, and this step prints "exactly what
        # their sources build" and exits 0: the rebuild-and-diff would assert nothing while
        # going green. Reproduced with a `git` stub that exits 128 — the inline form printed the
        # success message, the form below propagates 128.
        run: |
          dirty="$(git status --porcelain)"
          if [ -z "$dirty" ]; then
            echo "the committed Go artifacts are exactly what their sources build"
            exit 0
          fi
          echo "::error::the rebuilt Go artifacts differ from the committed ones — run 'just go-rules' and commit the result"
          echo "if you did run it and this is still red, compare the toolchain versions printed"
          echo "above against the four this job pins: they are all inputs to the artifact's bytes."
          git status --porcelain
          git --no-pager diff --stat
          exit 1

  # The Python component, built and proven through the real engine.
  #
  # Unlike the Go job beside it, there is no rebuild-and-diff step: `componentize-py`
  # output is not byte-reproducible, so there is nothing to diff. The proof is the
  # fidelity and determinism tests `just py-rules` runs against the freshly-built
  # artifact — a Python rule that reports the wrong thing fails the job.
  py-rules:
    name: py-rules (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # `just py-rules` runs the fidelity and determinism tests through `cargo nextest`,
      # so this job needs the Rust toolchain as well as the Python one.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: py-rules

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest

      # Which creates the venv, installs componentize-py 0.25.0, builds the three
      # artifacts, runs the SDK tests, and runs the fidelity and determinism tests.
      - run: just py-rules

  ci-ok:
    name: ci
    if: always()
    needs: [gate, test, msrv, bench, go-rules, py-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job did not succeed (${RESULTS})"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
