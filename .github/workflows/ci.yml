name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs are cancelled: a force-push should not leave the previous run
# burning minutes on a diff nobody will look at again. `main` is excluded, because
# every commit there is a merge someone may need the result of later.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. A job needing more asks for it explicitly, so widening the
# blast radius is a visible diff rather than an inherited default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The whole gate, in one job, by invoking the same recipe a developer runs.
  # There is deliberately no list of steps mirroring the justfile here — a mirror
  # drifts, and the moment it drifts "passes locally" stops meaning anything.
  gate:
    name: gate (just check)
    needs: components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete,typos

      # The built components, restored so `crates/lanekeep-rules/build.rs` finds them already
      # present (a no-op) and `lanekeep.json`/the self-check tests can read them from disk.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components

      # `just check`'s `test-js-types` runs `tsc` over `packages/lanekeep`, which needs the
      # `typescript` dev dependency installed. The authoring package's lockfile is the single
      # source for that toolchain, the same way `crates/lanekeep-rules/build.rs`'s is for the
      # component toolchains — `npm ci` reproduces it exactly.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the authoring package's dev dependencies
        run: npm ci --prefix packages/lanekeep

      - run: just check

  # Other platforms run the tests only. Formatting, clippy, licensing and spelling
  # are platform-independent, so running them three times buys nothing but minutes.
  test:
    name: test (${{ matrix.os }})
    needs: components
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just,cargo-nextest

      # The built components, for the same reason the gate job downloads them: build.rs reads
      # the shipped components and the self-check tests read theirs from disk.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components

      - run: just test

      # The justfile forces bash, which exists on the Windows runner via Git Bash,
      # so the shell tooling is exercised on every platform rather than assumed
      # portable.
      - run: just test-scripts

  # The MSRV in Cargo.toml is a promise to users. Untested, it is a comment that
  # silently becomes false the first time someone uses a newer language feature.
  #
  # This delegates to `just msrv` rather than installing 1.85 and running `cargo
  # check`, because that obvious version does not work: rust-toolchain.toml takes
  # precedence over the installed default, so plain `cargo check` here would test
  # 1.95.0 and pass regardless of what the MSRV actually is. The recipe reads the
  # version out of Cargo.toml and invokes `cargo +<version>`, which is the only
  # form that overrides the pin.
  msrv:
    name: msrv
    needs: components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just

      # The built components, so `build.rs` finds them present (a no-op) instead of reaching for
      # the component toolchains, which this job does not install.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components

      - run: just msrv

  # A single required check to point branch protection at. Adding a job above does
  # not then require also remembering to update the ruleset, and — importantly — a
  # skipped or cancelled dependency fails this rather than silently satisfying it.
  # The performance gate. Separate from `gate` because it needs a release build, which
  # takes long enough that pinning it to the debug-build job would slow every other check
  # down for no reason.
  #
  # The numbers print whether or not the gate fires — a regression that stays under the
  # threshold is still visible to anyone reading the log, which is the point.
  bench:
    name: bench (budgets)
    needs: components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just

      # The built components, for the same reason as every other job that compiles lanekeep-rules:
      # build.rs reads them, and this job does not install the component toolchains.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components

      - run: just bench

  # The WebAssembly components, built from source and uploaded so the gate and test jobs can
  # embed and read them without installing `cargo component`, Node, TinyGo or the other component
  # toolchains. The components are no longer committed — this job is what produces them.
  #
  # It also carries the one still-committed component's currency check. `just go-rules` rebuilds
  # the `go-maporder.wasm` fixture (the shipped `go-builtins.wasm` is un-committed now) and
  # re-records its digest, and the diff below fails if the committed fixture drifted from its
  # source. The shipped components' bytes are not diffed — they are build outputs, not inputs.
  #
  # **Four versions are pinned because all four are inputs to the Go fixture's bytes.** `tinygo
  # build` shells out to `wasm-opt` and to `wasm-tools`, and compiles the standard library out of
  # the Go toolchain's `GOROOT`; `just go-rules` documents the measurement. Installed by hand
  # rather than through actions, so that the four sit in one table a reader can compare against
  # the machine that produced the committed bytes. A floating version anywhere here is a red diff
  # nobody introduced.
  components:
    name: components (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `cargo component` needs the wasm target, and `just rust-rules` runs clippy and rustdoc
      # over the rule crates once their bindings exist.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: components

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just,cargo-binstall

      # `just rust-rules` needs it to build the rule components; it is not in any gate, so this
      # is the one place it is installed. `--force` because cargo-binstall has been observed to
      # report "already installed" and skip on a fresh runner where the binary is not actually
      # present; `command -v` fails the step loudly if it is still not on PATH after install.
      # Pinned to the version AGENTS.md's measurements name, so the Rust components' bytes stay
      # reproducible across runs.
      - name: Install cargo-component
        run: |
          cargo binstall --no-confirm --force cargo-component@0.21.1
          command -v cargo-component

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          # The root module has no `go.sum`, and the cache step errors rather than shrugging
          # when it cannot find the file it keys on.
          cache: false

      - name: Install TinyGo
        env:
          TINYGO_VERSION: "0.41.1"
          TINYGO_SHA256: "e156d1d93a376eef639a4143d13be07e8c463fb6cf2d7d447698ed4474d23e91"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/tinygo.tar.gz" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          echo "${TINYGO_SHA256}  ${RUNNER_TEMP}/tinygo.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/tinygo.tar.gz"
          echo "${RUNNER_TEMP}/tinygo/bin" >> "${GITHUB_PATH}"

      # Not the one TinyGo brings. Its Linux tarball bundles binaryen 116 at
      # `$TINYGOROOT/bin/wasm-opt`, and the committed fixture was built through 131.
      # `WASMOPT` is the one override TinyGo honors ahead of the copy in its own root.
      - name: Install binaryen (wasm-opt)
        env:
          BINARYEN_VERSION: "131"
          BINARYEN_SHA256: "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/binaryen.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${RUNNER_TEMP}/binaryen.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/binaryen.tar.gz"
          echo "WASMOPT=${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" >> "${GITHUB_ENV}"

      # TinyGo shells out to this for `component embed` and `component new`. It ships with
      # neither TinyGo nor the runner image, so without it the build dies at the encoding step
      # after a minute in LLVM.
      - name: Install wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.255.0"
          WASM_TOOLS_SHA256: "a62237f4731c45f665f1115cad39acaeec02963cbc848c9473ab033eed837072"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wasm-tools.tar.gz" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          echo "${WASM_TOOLS_SHA256}  ${RUNNER_TEMP}/wasm-tools.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/wasm-tools.tar.gz"
          echo "${RUNNER_TEMP}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux" >> "${GITHUB_PATH}"

      # `just typescript-builtins` needs the pinned jco toolchain, which `npm ci` installs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the jco toolchain
        run: npm ci --prefix packages/lanekeep

      # Build all three lanes: the Rust rule components (shipped + self-check), the Go built-ins
      # and fixture, and the TypeScript built-ins. `just go-rules` also re-records the Go
      # fixture's digest, so a stale fixture lands in the diff below.
      - run: |
          just rust-rules
          just go-rules
          just typescript-builtins

      - name: The committed Go fixture must be the one its sources build
        # **The assignment is a statement of its own, and that is the whole point.** `bash -e`
        # does not abort on a command substitution that fails inside `[ ... ]` — the exit
        # status the shell sees is the test's, not git's. Written as
        # `if [ -z "$(git status --porcelain)" ]`, a git that dies for any reason at all
        # substitutes the empty string, the branch is taken, and this step prints "exactly what
        # their sources build" and exits 0: the rebuild-and-diff would assert nothing while
        # going green. Reproduced with a `git` stub that exits 128 — the inline form printed the
        # success message, the form below propagates 128.
        run: |
          dirty="$(git status --porcelain)"
          if [ -z "$dirty" ]; then
            echo "the committed Go fixture is exactly what its sources build"
            exit 0
          fi
          echo "::error::the rebuilt Go fixture differs from the committed one — run 'just go-rules' and commit the result"
          echo "if you did run it and this is still red, compare the toolchain versions printed"
          echo "above against the four this job pins: they are all inputs to the fixture's bytes."
          git status --porcelain
          git --no-pager diff --stat
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components/
          if-no-files-found: error
          retention-days: 1

  # The Python component, built and proven through the real engine.
  #
  # Unlike the Go job beside it, there is no rebuild-and-diff step: `componentize-py`
  # output is not byte-reproducible, so there is nothing to diff. The proof is the
  # fidelity and determinism tests `just py-rules` runs against the freshly-built
  # artifact — a Python rule that reports the wrong thing fails the job.
  py-rules:
    name: py-rules (build and test)
    needs: components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # `just py-rules` runs the fidelity and determinism tests through `cargo nextest`,
      # so this job needs the Rust toolchain as well as the Python one.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: py-rules

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just,cargo-nextest

      # `just py-rules` compiles `lanekeep-rules` (for `python_rules.rs`), so build.rs needs the
      # built components present — this job does not install the component toolchains.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: components
          path: crates/lanekeep-rules/components

      # Which creates the venv, installs componentize-py 0.25.0, builds the three
      # artifacts, runs the SDK tests, and runs the fidelity and determinism tests.
      - run: just py-rules

  ci-ok:
    name: ci
    if: always()
    needs: [gate, test, msrv, bench, components, py-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job did not succeed (${RESULTS})"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
