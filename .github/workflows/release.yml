# Build and publish a release.
#
# Runs on a `v*` tag. Nothing here fires on a push to a branch, and nothing publishes
# without the tag existing — a release is a deliberate act, and a workflow that could
# publish by accident is one that eventually will.
#
# Publishing needs two secrets that are deliberately absent until someone adds them:
# `CARGO_REGISTRY_TOKEN` and `NPM_TOKEN`. Without them the build and packaging still run and
# the artifacts are still attached to the release — so a dry run is the default, and the
# first real publish is a decision someone makes rather than one this file makes for them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (dry run: nothing is published)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # One job per target, each built natively. Cross-compilation would be fewer jobs and more
  # ways to be subtly wrong — a binary that links against the wrong libc is a bug reported by
  # a user rather than by CI.
  #
  # No Intel macOS. Building it natively needs a `macos-13` runner, and GitHub no longer
  # reliably provides one — a release that waits forever on a runner that never arrives is
  # worse than one platform fewer. An Intel Mac user gets a message naming what is available
  # and `cargo install lanekeep-cli`, which builds from source.
  #
  # It could be cross-compiled from an ARM runner: Apple ships both SDKs and the target is a
  # `rustup target add` away. What that would cost is the smoke test — GitHub's ARM macOS
  # runners have no Rosetta, so nothing could execute the binary before shipping it. Adding
  # a platform nobody has run once is how a broken binary reaches a user.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # `glibc` pins the oldest glibc the Linux binaries may require. Without it the
          # floor is whatever the runner image happens to ship, which is not a decision
          # anyone made: `ubuntu-latest` rolled from 22.04 to 24.04 and took the floor from
          # 2.35 to 2.39 with it, so v0.3.1's Linux binary does not start on Ubuntu 22.04,
          # Debian 12 or RHEL 9. Every check stayed green, because the smoke test runs on
          # the machine that built it — the one machine where the floor is never wrong.
          #
          # 2.17 is the manylinux2014 baseline, which is what the Python wheels claim and
          # `build-python-wheels.sh` verifies against the binary before tagging one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            glibc: "2.17"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image can arrive with a partially installed toolchain at the pinned
      # version, and that is enough to fail the build.
      #
      # `rust-toolchain.toml` asks for `rust-src`. No workflow installs it, so cargo has
      # rustup add it at build time — and rustup refuses with "detected conflict:
      # lib/rustlib/src/rust/library/Cargo.lock" when the files are already on disk but the
      # component is not recorded as installed. v0.5.0's first release build died there,
      # reproducibly, on `ubuntu-24.04-arm` alone. v0.4.0 built fine on the same workflow, so
      # the image changed under us rather than anything here.
      #
      # Removing the toolchain first makes the install below a clean one. It is a no-op
      # wherever the image did not preinstall it, which is why this is unconditional rather
      # than guarded on the target — the next image to do this will be a different one.
      #
      # The version is read from the pin rather than written out again, so this cannot drift
      # from the toolchain the build actually uses.
      - name: Clear any partially installed toolchain
        shell: bash
        run: |
          pinned="$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "clearing any existing ${pinned} before a clean install"
          rustup toolchain uninstall "${pinned}" || true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      # Deliberately uncached, for two reasons. A binary someone will download should be
      # built from a clean tree rather than from whatever a cache happened to hold — a
      # release is the one build where a stale artifact is worst. And `Swatinem/rust-cache`
      # is LGPL-3.0, which `deny.toml`'s allow-list does not include; adding it there to
      # save a few minutes on a job that runs once per release would be relaxing a check to
      # make a change pass.

      # Both from PyPI, which ship them as prebuilt wheels — `cargo install cargo-zigbuild`
      # would compile it from source on every release for no gain. Pinned, because the whole
      # point of this step is that the toolchain stops being whatever the runner happens to
      # have.
      #
      # Into a virtualenv rather than `pip install` bare: Ubuntu 24.04 marks its system Python
      # externally managed (PEP 668), and a bare install there fails outright. A venv is
      # unambiguous on every image and costs a second.
      - name: Install cargo-zigbuild
        if: matrix.glibc != ''
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/zig"
          "${RUNNER_TEMP}/zig/bin/pip" install --quiet cargo-zigbuild==0.23.0 ziglang==0.16.0
          echo "${RUNNER_TEMP}/zig/bin" >> "${GITHUB_PATH}"

      # The `dist` profile, not `release`: it turns on LTO and strips symbols, which is
      # what a shipped binary wants and what a developer's `cargo build --release` should
      # not have to pay for.
      #
      # Linux goes through zigbuild, whose target triple takes a glibc suffix — that suffix
      # is the only thing in this repository that states the floor rather than inheriting it.
      # zig writes its output to the same `target/<triple>/dist/` path cargo would, so
      # everything downstream is unchanged.
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          if [ -n "${GLIBC}" ]; then
            cargo zigbuild --profile dist --target "${TARGET}.${GLIBC}" -p lanekeep-cli
          else
            cargo build --profile dist --target "${TARGET}" -p lanekeep-cli
          fi

      # A binary that cannot answer `--version` is a binary nobody should be shipping, and
      # this is the last moment it costs nothing to find out.
      - name: Smoke test
        if: matrix.target != 'aarch64-unknown-linux-gnu' || runner.arch == 'ARM64'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/dist/lanekeep"
          [ -f "${binary}.exe" ] && binary="${binary}.exe"
          "${binary}" --version
          "${binary}" --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/lanekeep
            target/${{ matrix.target }}/dist/lanekeep.exe
          if-no-files-found: error
          retention-days: 7

  # Assemble the npm packages from every platform's binary, and attach them to the run.
  # Separate from publishing so the assembly is verifiable without a token.
  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Resolve version
        id: version
        env:
          # Through `env:`, never interpolated into the script. A tag is
          # attacker-controllable in the general case, and `${{ }}` is substituted before
          # bash sees it.
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#v}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "resolved version ${version}"

      - name: Assemble npm packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-npm-packages.sh "${VERSION}" dist dist-npm

      # Early, because this is the step that verifies the Linux binaries' glibc floor against
      # the manylinux tag they are about to carry. It is the only check in the release that
      # looks at what the binaries actually require, so failing here costs nothing and failing
      # later costs a version number.
      - name: Assemble Python wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-python-wheels.sh "${VERSION}" dist dist-wheels

      - name: Assemble release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release-archives.sh "${VERSION}" dist dist-archives

      # From the archives' own SHA256SUMS, so the formula cannot disagree with what a user
      # verifies a download against.
      - name: Generate the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-homebrew-formula.sh "${VERSION}" dist-archives dist-homebrew/lanekeep.rb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist-archives/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist-homebrew/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist-npm/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels
          path: dist-wheels/
          if-no-files-found: error
          retention-days: 7

  # The only job that publishes anything. Gated on the tag *and* on the secrets existing, so
  # a fork, a dry run, and a repository nobody has configured all stop here rather than
  # failing halfway through a partial release.
  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # `contents` for the release itself.
      contents: write
      # `id-token` is what `npm publish --provenance` needs: npm mints a signed attestation
      # linking the published tarball to this workflow run and this commit, and it gets the
      # OIDC token to do that from Actions. Without this the publish *fails* — which is a
      # failure no dry run can surface, because the step it would fail in is skipped when no
      # secrets are configured.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist-npm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist-archives

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: dist-homebrew

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheels
          path: dist-wheels

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Which registries this run can publish to, decided once and stated out loud.
      #
      # A step's own `env:` is not available to that step's `if:` — the condition is
      # evaluated to decide whether the step runs at all, before its environment exists. So
      # `if: env.NPM_TOKEN != ''` on a step that sets `NPM_TOKEN` in its own `env:` reads an
      # undefined variable and is *always* false. That is the worst possible failure here: a
      # release that reports success and publishes nothing, indistinguishable from a
      # deliberate dry run.
      #
      # Deciding in one step and branching on its output avoids the question entirely, keeps
      # the secrets scoped to the step that reads them, and puts the answer in the log where
      # someone cutting a release can see it.
      - name: Decide what this run may publish
        id: gates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          npm="${NPM_TOKEN:+yes}"
          crates="${CARGO_REGISTRY_TOKEN:+yes}"
          brew="${HOMEBREW_TAP_TOKEN:+yes}"
          pypi="${PYPI_TOKEN:+yes}"
          echo "npm=${npm:-no}" >> "${GITHUB_OUTPUT}"
          echo "crates=${crates:-no}" >> "${GITHUB_OUTPUT}"
          echo "brew=${brew:-no}" >> "${GITHUB_OUTPUT}"
          echo "pypi=${pypi:-no}" >> "${GITHUB_OUTPUT}"

          echo "npm:       ${npm:-no (dry run)}"
          echo "crates.io: ${crates:-no (dry run)}"
          echo "pypi:      ${pypi:-no (dry run)}"
          echo "homebrew:  ${brew:-no (tap not configured)}"
          if [ -z "${npm}" ] && [ -z "${crates}" ] && [ -z "${pypi}" ]; then
            echo "::notice::no registry secrets configured — this run publishes nothing"
          fi

      # Both publishes go through a script rather than an inline loop. These are the two
      # least recoverable steps in the release — neither registry lets a version be replaced —
      # and an inline loop is untested shell that only ever runs against the real thing. The
      # scripts have tests, which `just check` runs, and both encode what v0.1.0's first
      # release got wrong: path handling npm can misread, and no way to resume a partial run.
      - name: Publish npm packages
        if: steps.gates.outputs.npm == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish-npm.sh dist-npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - name: Publish crates
        if: steps.gates.outputs.crates == 'yes'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh

      # PyPI takes the wheels as they were built — there is no launcher and no ordering
      # constraint, because a wheel names its own platform in its filename and pip picks by
      # that. The one thing that matters is resuming a partial upload, which the script does
      # per file; see the note there for why per version is not good enough.
      - name: Publish Python wheels
        if: steps.gates.outputs.pypi == 'yes'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/twine"
          "${RUNNER_TEMP}/twine/bin/pip" install --quiet twine==7.0.0
          TWINE="${RUNNER_TEMP}/twine/bin/twine" ./scripts/publish-pypi.sh dist-wheels

      # After the registries, because the formula points at release assets and a tap updated
      # ahead of them would offer a download that 404s.
      #
      # A separate secret from RELEASE_PLZ_TOKEN: that one is scoped to this repository, and
      # pushing to the tap needs a token that reaches a different one. Absent, the step is
      # skipped and the gate above says so.
      - name: Update the Homebrew tap
        if: steps.gates.outputs.brew == 'yes'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/fmsouza/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist-homebrew/lanekeep.rb tap/Formula/lanekeep.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Staged *before* the comparison, because `git diff` alone does not see an
          # untracked file. On a tap that has no formula yet, copying one in leaves it
          # untracked, `git diff --quiet` reports nothing to do, and the step announces
          # "already current" and pushes nothing — succeeding while doing the opposite of
          # its job.
          git add Formula/lanekeep.rb
          if git diff --cached --quiet; then
            echo "the formula is already current"
            exit 0
          fi

          git commit -m "lanekeep ${TAG}"
          git push

      # Last, because a releases page advertising a version that is on neither registry is
      # worse than one that appears a minute later.
      #
      # release-plz normally creates the release when it tags; this creates one if it is
      # absent, so a tag pushed by hand — which is how every release so far has happened —
      # still gets its binaries. `--clobber` makes a re-run replace assets rather than fail on
      # the ones already there, which is the same resumability the registry publishes have.
      #
      # The tag goes through `env:`. A ref name is attacker-controllable in the general case
      # and `${{ }}` is substituted before bash sees the script.
      - name: Attach the archives to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "no release for ${TAG} yet — creating one"
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" dist-archives/* --clobber
          echo "attached $(find dist-archives -type f | wc -l | tr -d ' ') file(s) to ${TAG}"
