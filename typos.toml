[files]
extend-exclude = [
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "fixtures/**",
    "*.snap",
    # Upstream's grammar sources and the parsers generated from them, vendored unchanged except
    # for what `crates/lanekeep-tree-sitter-typescript/grammar/patch.py` does to `grammar.json`.
    # Not this project's prose, and not something to respell.
    "crates/lanekeep-tree-sitter-typescript/common/**",
    "crates/lanekeep-tree-sitter-typescript/typescript/**",
    "crates/lanekeep-tree-sitter-typescript/tsx/**",
    "crates/lanekeep-tree-sitter-typescript/LICENSE",
]

[default.extend-words]
# tree-sitter node kinds and query syntax that read as typos but are not.
ba = "ba"
# A file extension, not a truncated word: Stylus writes `.styl`, and the asset denylist in
# `crates/lanekeep-types/src/builtin.rs` has to spell it the way the filesystem does. This
# version of `typos` honors no inline suppression, so the exemption is global or nothing.
styl = "styl"

[default]
locale = "en-us"
