[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fmsouza/lanekeep"
homepage = "https://github.com/fmsouza/lanekeep"
authors = ["Fred Souza <1396615+fmsouza@users.noreply.github.com>"]
keywords = ["linter", "static-analysis", "tree-sitter", "typescript", "conformance"]
categories = ["development-tools", "development-tools::testing"]

# Internal crate versions are declared once here so a version bump touches one line.
# Dependency edges are added to each crate as its code needs them, not up front —
# an unused dependency is a cargo-machete failure, and the intended graph is
# documented in docs/architecture.md §3.
[workspace.dependencies]
lanekeep-cache = { version = "0.3.0", path = "crates/lanekeep-cache" }
lanekeep-cli = { version = "0.3.0", path = "crates/lanekeep-cli" }
lanekeep-config = { version = "0.3.0", path = "crates/lanekeep-config" }
lanekeep-core = { version = "0.3.0", path = "crates/lanekeep-core" }
lanekeep-engine = { version = "0.3.0", path = "crates/lanekeep-engine" }
lanekeep-js = { version = "0.3.0", path = "crates/lanekeep-js" }
lanekeep-lang = { version = "0.3.0", path = "crates/lanekeep-lang" }
lanekeep-languages = { version = "0.3.0", path = "crates/lanekeep-languages" }
lanekeep-lang-js = { version = "0.3.0", path = "crates/lanekeep-lang-js" }
lanekeep-lang-python = { version = "0.3.0", path = "crates/lanekeep-lang-python" }
lanekeep-query = { version = "0.3.0", path = "crates/lanekeep-query" }
lanekeep-report = { version = "0.3.0", path = "crates/lanekeep-report" }
lanekeep-server = { version = "0.3.0", path = "crates/lanekeep-server" }
lanekeep-rules = { version = "0.3.0", path = "crates/lanekeep-rules" }
lanekeep-testkit = { version = "0.3.0", path = "crates/lanekeep-testkit" }

# External dependencies are versioned once here so two crates cannot disagree, which
# would otherwise show up as a duplicate in the dependency graph rather than as an error.
# Default features deliberately left on, which is where `std` comes from. Turning them
# off builds fine inside lanekeep-core's own test target — serde_json is a dev-dependency
# and drags `std` back in — and then fails for the first crate that depends on
# lanekeep-core normally, because `String` has no `Deserialize` without it. lanekeep ships
# as a CLI binary and has no no_std ambition, so the minimization bought nothing and hid a
# build failure one crate away.
serde = { version = "1" }
serde_json = { version = "1" }
# Snapshot testing for the four reporter formats. `yaml` so a snapshot reads as the
# structure it is, rather than as one long escaped line.
insta = { version = "1", features = ["yaml"] }
blake3 = { version = "1" }
ignore = { version = "0.4" }
globset = { version = "0.4" }
rayon = { version = "1" }
memchr = { version = "2" }
clap = { version = "4", features = ["derive"] }
anyhow = { version = "1" }
thiserror = { version = "2" }
notify = { version = "8.2" }
notify-debouncer-mini = { version = "0.7" }
tree-sitter = { version = "0.26" }
tree-sitter-typescript = { version = "0.23" }
tree-sitter-javascript = { version = "0.25" }
tree-sitter-python = { version = "0.25" }
streaming-iterator = { version = "0.1" }
rquickjs = { version = "0.12", features = ["loader"] }

[workspace.lints.rust]
# Denied rather than forbidden: lanekeep-cache needs `unsafe` for memory mapping and
# lanekeep-js for the engine FFI boundary. Those crates opt in locally, at the use
# site, with a comment explaining the invariant being upheld. `forbid` cannot be
# overridden that way, which would push the unsafe somewhere less visible.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Correctness and clarity lints outside pedantic that are worth having on a tool
# whose whole value proposition is being trusted to be right.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
# Silent-failure lints. A rules engine that quietly truncates a number or swallows
# a conversion produces wrong results with no error, which is the worst outcome.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Noise. `module_name_repetitions` fights the crate-per-concern layout, and
# `must_use_candidate` on a codebase this size is thousands of annotations.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Benchmarks need symbols to be interpretable in a profiler, so they inherit
# release optimization without the stripping.
[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"

# Used by cargo-dist for shipped binaries. Fat LTO costs build time we only pay
# on release, in exchange for the binary users actually run being the fastest one.
[profile.dist]
inherits = "release"
lto = "fat"
