[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
# Moved 1.88 → 1.94 because wasmtime 47.0.3 declares `rust-version = "1.94.0"`, not for
# syntax. 38.0.4 is the newest wasmtime that builds on 1.88 — nine major releases behind
# the one every measurement behind `lanekeep-wasm` was taken against — so keeping the old
# floor meant keeping a different runtime than the one that was evaluated.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fmsouza/lanekeep"
homepage = "https://github.com/fmsouza/lanekeep"
authors = ["Fred Souza <1396615+fmsouza@users.noreply.github.com>"]
keywords = ["linter", "static-analysis", "tree-sitter", "typescript", "conformance"]
categories = ["development-tools", "development-tools::testing"]

# Internal crate versions are declared once here so a version bump touches one line.
# Dependency edges are added to each crate as its code needs them, not up front —
# an unused dependency is a cargo-machete failure, and the intended graph is
# documented in docs/architecture.md §3.
[workspace.dependencies]
lanekeep-cache = { version = "0.9.0", path = "crates/lanekeep-cache" }
lanekeep-cli = { version = "0.9.0", path = "crates/lanekeep-cli" }
lanekeep-config = { version = "0.9.0", path = "crates/lanekeep-config" }
lanekeep-core = { version = "0.9.0", path = "crates/lanekeep-core" }
lanekeep-engine = { version = "0.9.0", path = "crates/lanekeep-engine" }
lanekeep-js = { version = "0.9.0", path = "crates/lanekeep-js" }
lanekeep-lang = { version = "0.9.0", path = "crates/lanekeep-lang" }
lanekeep-languages = { version = "0.9.0", path = "crates/lanekeep-languages" }
lanekeep-lang-js = { version = "0.9.0", path = "crates/lanekeep-lang-js" }
lanekeep-lang-go = { version = "0.9.0", path = "crates/lanekeep-lang-go" }
lanekeep-lang-python = { version = "0.9.0", path = "crates/lanekeep-lang-python" }
lanekeep-lang-rust = { version = "0.9.0", path = "crates/lanekeep-lang-rust" }
lanekeep-nodes = { version = "0.9.0", path = "crates/lanekeep-nodes" }
lanekeep-query = { version = "0.9.0", path = "crates/lanekeep-query" }
lanekeep-report = { version = "0.9.0", path = "crates/lanekeep-report" }
lanekeep-server = { version = "0.9.0", path = "crates/lanekeep-server" }
lanekeep-types = { version = "0.9.0", path = "crates/lanekeep-types" }
lanekeep-rules = { version = "0.9.0", path = "crates/lanekeep-rules" }
lanekeep-testkit = { version = "0.9.0", path = "crates/lanekeep-testkit" }
lanekeep-wasm = { version = "0.9.0", path = "crates/lanekeep-wasm" }

# External dependencies are versioned once here so two crates cannot disagree, which
# would otherwise show up as a duplicate in the dependency graph rather than as an error.
# Default features deliberately left on, which is where `std` comes from. Turning them
# off builds fine inside lanekeep-core's own test target — serde_json is a dev-dependency
# and drags `std` back in — and then fails for the first crate that depends on
# lanekeep-core normally, because `String` has no `Deserialize` without it. lanekeep ships
# as a CLI binary and has no no_std ambition, so the minimization bought nothing and hid a
# build failure one crate away.
serde = { version = "1" }
serde_json = { version = "1" }
# Snapshot testing for the four reporter formats. `yaml` so a snapshot reads as the
# structure it is, rather than as one long escaped line.
insta = { version = "1", features = ["yaml"] }
blake3 = { version = "1" }
ignore = { version = "0.4" }
globset = { version = "0.4" }
rayon = { version = "1" }
memchr = { version = "2" }
clap = { version = "4", features = ["derive"] }
anyhow = { version = "1" }
thiserror = { version = "2" }
notify = { version = "8.2" }
notify-debouncer-mini = { version = "0.7" }
tree-sitter = { version = "0.26" }
tree-sitter-typescript = { version = "0.23" }
tree-sitter-javascript = { version = "0.25" }
tree-sitter-python = { version = "0.25" }
tree-sitter-go = { version = "0.25" }
tree-sitter-rust = { version = "0.24" }
streaming-iterator = { version = "0.1" }
rquickjs = { version = "0.12", features = ["loader"] }
# The WebAssembly component runtime rules execute on. `default-features = false` and an
# explicit list, because wasmtime's default set is fourteen features wide and includes
# `async`, `cache` and `gc`, none of which lanekeep uses — `async` in particular would
# drag in a futures executor for a synchronous `Store`.
#
# `cranelift` is not optional and not a performance preference. lanekeep is the only thing
# on a user's machine that can turn a rule component into a form a run can afford to load:
# compiling twenty components at check time costs ~186 ms against ~0.74 ms to load twenty
# precompiled ones. `cranelift` is what does that compiling.
#
# `std` is redundant beside `cranelift`, which already implies it — wasmtime 47.0.3 defines
# `cranelift = ["dep:wasmtime-cranelift", "std", "wasmtime-unwinder/cranelift"]`. It is
# written out anyway because dropping `cranelift` without also naming `std` selects
# wasmtime's bare-metal `custom` platform backend, which expects the embedder to supply
# `wasmtime_tls_get` and friends by hand and fails at the link step here. `cargo check`
# never invokes the linker and cannot see that, so the redundant spelling is a guard
# against a future edit that removes one feature and passes a check it should not.
wasmtime = { version = "47.0.3", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    "std",
] }

[workspace.lints.rust]
# Denied rather than forbidden: lanekeep-cache needs `unsafe` for memory mapping and
# lanekeep-js for the engine FFI boundary. Those crates opt in locally, at the use
# site, with a comment explaining the invariant being upheld. `forbid` cannot be
# overridden that way, which would push the unsafe somewhere less visible.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Correctness and clarity lints outside pedantic that are worth having on a tool
# whose whole value proposition is being trusted to be right.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
# Silent-failure lints. A rules engine that quietly truncates a number or swallows
# a conversion produces wrong results with no error, which is the worst outcome.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Noise. `module_name_repetitions` fights the crate-per-concern layout, and
# `must_use_candidate` on a codebase this size is thousands of annotations.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize wasmtime's compiler even in a debug build, because the test suite runs it.
#
# Nothing here optimizes lanekeep — these three crates are Cranelift, and every test that
# loads a WebAssembly component pays for them compiling it. Unoptimized they dominate:
# measured 2026-08-10 on `cargo test -p lanekeep-wasm --test js_globals`, whose fixture is a
# 12.4 MiB JavaScript component, **92.90 s becomes 15.42 s**. The one-time cost is about 35 s
# to rebuild the three of them.
#
# It changes nothing a user ever runs. Release builds already optimize everything, and
# wasmtime's own codegen settings — what it emits for a guest, and how fast that guest runs —
# are untouched; this is only how fast the compiler itself executes while compiling.
#
# The third name is `wasmtime-internal-cranelift` and not `wasmtime-cranelift`, which is what
# every other project's version of this stanza says: wasmtime 47 renamed its internals behind
# that prefix. Cargo does say so — `profile package spec ... did not match any packages` — but
# it says it as a warning on every build, so a stanza that silently does nothing is exactly
# what you get by copying the usual spelling. Check for that warning if this is ever edited.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

# Benchmarks need symbols to be interpretable in a profiler, so they inherit
# release optimization without the stripping.
[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"

# Used by cargo-dist for shipped binaries. Fat LTO costs build time we only pay
# on release, in exchange for the binary users actually run being the fastest one.
[profile.dist]
inherits = "release"
lto = "fat"
