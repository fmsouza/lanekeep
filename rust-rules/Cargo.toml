# Rule crates, authored in the language they inspect and compiled to WebAssembly components.
#
# Its own workspace, not a member of the root one. `members = ["crates/*"]` there is a
# single-level glob so nothing here is swept in, and a crate that cross-compiles to wasm32
# has a different dependency graph and a different default target from everything that builds
# for the host — `cargo build --workspace` overrides `default-members`, so exclusion there is
# not enough on its own.
#
# One workspace for all rule crates rather than one per crate, unlike the fixtures under
# crates/lanekeep-wasm/tests/fixtures/: those are fixtures and can afford a lockfile each,
# while these are shipped artifacts whose dependency graph has to pass the supply-chain gate,
# and one workspace means one `cargo deny` invocation rather than a loop.
[workspace]
resolver = "3"
# Listed one by one rather than as `["*"]`: a glob here matches `target/` the moment anything
# is built, and cargo then fails to load the workspace at all. A missing member is a manifest
# error too, so a crate joins this list in the same change that creates it.
members = ["lanekeep-rule", "no-unwrap", "no-glob-import", "one-parser-per-file"]
# What builds without `cargo component`.
#
# A rule crate's `src/bindings.rs` is generated by `cargo component build` and gitignored, so on
# a fresh checkout it does not exist and the crate does not compile — for the host target as much
# as for wasm32. `just test-rust-rules` is in both gates and the gates deliberately do not
# require `cargo component`, so it runs the default members rather than the workspace. A crate
# joins this list when it is buildable from a clean tree with plain `cargo`, which today is the
# SDK and nothing else.
#
# `cargo build --workspace` overrides this, which is exactly why the recipe does not pass it.
default-members = ["lanekeep-rule"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
# `deny.toml` has no exemption for unpublished crates — every crate in the root workspace
# carries a real `license` field, and `cargo deny check licenses` fails on one that does not.
# Matches the root `Cargo.toml`'s own value, which is what the code these rules ship beside
# is actually licensed under.
license = "MIT OR Apache-2.0"
# Matches the root `Cargo.toml`'s own floor. Nothing here has a stricter requirement of its own,
# so there is no reason to diverge — and `just msrv` reads this number rather than assuming it
# equals the root's, then checks this workspace against it. Two separate promises about two
# separate workspaces, enforced separately, which is why the number is written here at all.
rust-version = "1.94"

# `[lints] workspace = true` resolves only within one workspace, so the root Cargo.toml's
# table does not reach here and this is a copy of its `[workspace.lints.*]` (lines 100-132)
# rather than a reference. Kept identical on purpose; a divergence is a finding.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "s"
strip = true
