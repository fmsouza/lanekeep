# release-plz reads the Conventional Commit on `main` — which, because `main` takes squash
# merges only, is the pull request title — and opens a release pull request with the version
# bump and the changelog.
#
# It does not publish. Publishing happens in `release.yml`, on the tag that merging the
# release pull request creates. Keeping the two separate means the version bump is
# reviewable as an ordinary change, and the publish is gated on a tag rather than on a merge.

[workspace]
# One version across every crate. They are released together and only make sense together —
# `lanekeep-cli` 0.2 against `lanekeep-core` 0.1 is a combination nobody wants to support.
dependencies_update = false
git_release_enable = true
git_tag_enable = true
publish = false
semver_check = true

# The changelog is for people deciding whether to upgrade, so it lists what changed for
# them. Chores and CI changes did not.
[changelog]
sort_commits = "oldest"

[[package]]
name = "lanekeep-cli"
# The binary is what users install, so its release is the one worth announcing.
git_release_enable = true

# Everything below ships as part of the release rather than announcing its own.
[[package]]
name = "lanekeep-core"
git_release_enable = false

[[package]]
name = "lanekeep-cache"
git_release_enable = false

[[package]]
name = "lanekeep-config"
git_release_enable = false

[[package]]
name = "lanekeep-engine"
git_release_enable = false

[[package]]
name = "lanekeep-js"
git_release_enable = false

[[package]]
name = "lanekeep-lang"
git_release_enable = false

[[package]]
name = "lanekeep-lang-js"
git_release_enable = false

[[package]]
name = "lanekeep-query"
git_release_enable = false

[[package]]
name = "lanekeep-report"
git_release_enable = false

[[package]]
name = "lanekeep-rules"
git_release_enable = false

[[package]]
name = "lanekeep-testkit"
git_release_enable = false
